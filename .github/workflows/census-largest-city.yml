name: Census largest-city check

# T-085b's data: is each state's capital its largest city, per the newest
# U.S. Census Bureau city-population release? Runs
# `question-bank/src/census/fetch-largest-city.ts`, which writes
# `question-bank/data/census/largest-city.json`.
#
# The Census Bureau publishes this release once a year (usually in May), so
# most months nothing changes and this job ends quietly. When the file does
# change, it opens a pull request for a person to read. It never touches the
# question bank itself.
#
# Opening the PR needs Settings → Actions → General → "Allow GitHub Actions to
# create and approve pull requests". A PR opened with the workflow's own token
# does not start CI; push to its branch or close and reopen it to run checks.
#
# To run it now, use "Run workflow" on the Actions tab.
on:
  schedule:
    # 07:41 UTC on the 3rd of every month.
    - cron: "41 7 3 * *"
  workflow_dispatch:
    inputs:
      vintage:
        description: "Census vintage year (blank = newest available)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  census:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: question-bank
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Fetch and compare
        id: fetch
        env:
          VINTAGE: ${{ inputs.vintage }}
        run: |
          set +e
          if [ -n "$VINTAGE" ]; then
            bun run src/census/fetch-largest-city.ts --vintage "$VINTAGE" | tee ../census.log
          else
            bun run src/census/fetch-largest-city.ts | tee ../census.log
          fi
          code=${PIPESTATUS[0]}
          set -e
          case $code in
            0) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - name: Open a pull request
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="census/largest-city-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/census/largest-city.json
          git commit -m "Census largest-city check: new release data"
          git push -u origin "$branch"
          {
            echo "The Census largest-city check found new data."
            echo
            echo '```'
            cat ../census.log
            echo '```'
            echo
            echo "This PR only records the release. T-085b decides what it changes in the bank."
          } > ../body.md
          gh pr create --draft --base main --head "$branch" \
            --title "Census largest-city check: new release data" \
            --body-file ../body.md
