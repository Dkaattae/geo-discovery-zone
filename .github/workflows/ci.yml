name: CI

# Every pull request targeting the default branch, and every push to it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# One job per package. `question-bank` pins typescript@^7 and `frontend` pins
# ^5.8, with different tsconfig.json files, so `tsc` is never run over both at
# once. Separate jobs also mean a red package does not hide the other one.
jobs:
  frontend:
    name: frontend (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned rather than `latest`: a bun release should not be able to
          # turn this workflow red on a branch nobody touched.
          bun-version: 1.3.11

      # --frozen-lockfile installs exactly what bun.lock pins and fails instead
      # of resolving anything new, so the run cannot rewrite the lockfile.
      # frontend/bunfig.toml sets minimumReleaseAge = 86400, which means an
      # unpinned install can legitimately resolve differently in CI than it did
      # locally — a lockfile that drifts in CI is a supply-chain guard that has
      # stopped guarding.
      - name: Install
        id: install
        run: bun install --frozen-lockfile

      # Evidence in the run's own log that the install left bun.lock alone.
      - name: Lockfile unchanged
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git diff --exit-code -- bun.lock

      # The three checks below are independent: each runs whenever the install
      # succeeded, rather than only when the step before it passed, so one red
      # check does not hide the result of the others. This never turns a failing
      # check green — a failed step still fails the job and the run.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # `bun test` exits 1 when a package contains no test files at all, and
        # frontend/ has none until T-004 adds them. `--pass-with-no-tests` makes
        # bun exit 0 for that one case and nothing else: a test that exists and
        # fails still exits non-zero and still fails this step.
        #
        # This step deliberately contains no shell logic. The previous version
        # decided "are there test files?" itself, with a `find` regex over
        # `js|jsx|ts|tsx` — but bun also runs `.mts`, `.cts`, `.mjs` and `.cjs`,
        # and bun does not prune `dist`/`.output`/`.vinxi` the way that `find`
        # did. Any hand-written copy of bun's discovery can disagree with bun,
        # and when it does the step reports "no tests" while real tests fail.
        # That happened: run 31270170161 was green with a failing
        # `frontend/probe.test.mts` in the tree. So the question is now put to
        # bun instead of re-implemented, and there is no `exit 0` here at all —
        # bun's exit code is the step's exit code in every state.
        #
        # Not `continue-on-error`, not `|| true`, not `set +e`, not `always()`:
        # none of those distinguish "no tests" from "tests failed".
        run: bun test --pass-with-no-tests

  question-bank:
    name: question-bank (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: question-bank
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install
        id: install
        run: bun install --frozen-lockfile

      - name: Lockfile unchanged
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git diff --exit-code -- bun.lock

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck

      # No lint step: question-bank has no eslint config and no eslint
      # dependency, and adding either is a dependency decision this task may not
      # make on its own. Its formatting is covered by nothing today; see the
      # brief's Handoff.
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun test

  # The backend's 221 tests ran nowhere until this job existed. Same shape as the
  # TS jobs above: install from a frozen lockfile, prove the lockfile did not
  # move, then run the checks independently so one red step does not hide another.
  backend:
    name: backend (lint, format, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          # Pinned for the same reason bun is: a release should not turn this
          # workflow red on a branch nobody touched.
          version: "0.8.17"
          python-version: "3.11"

      - name: Install
        id: install
        # --frozen resolves nothing: it installs exactly what uv.lock pins and
        # fails if the lockfile and pyproject.toml disagree.
        run: uv sync --frozen

      - name: Lockfile unchanged
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git diff --exit-code -- uv.lock

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff check .

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff format --check .

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # SQLite, the default. The 9 Postgres-only tests skip here and run in
        # the job below.
        run: uv run pytest

  # Postgres is a supported backend, so it is tested rather than assumed. Same
  # suite, different URL — a dialect-specific regression fails a PR instead of a
  # deployment.
  backend-postgres:
    name: backend (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geoquiz_test
        ports:
          - 5432:5432
        # Without this the job races the database on a cold runner.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.11"

      - name: Install
        run: uv sync --frozen

      - name: Test against Postgres
        env:
          GEO_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/geoquiz_test
        run: uv run pytest

  # The only job that builds the image and brings the stack up. Everything else
  # tests the code; this tests the Dockerfile, the compose file, the frontend
  # build and the container's Postgres — the parts a unit test cannot reach.
  #
  # Slow by nature (a full frontend build plus an image build), so it runs last
  # and on its own. If it is ever the reason PRs feel slow, move it to a
  # schedule rather than deleting it: nothing else covers this ground.
  integration:
    name: integration (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.11"

      - name: Install test dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run the suite against a real stack
        working-directory: backend
        # The fixture builds the image, waits for /health, runs, and tears the
        # stack down — including its volume — however the run ends.
        run: uv run pytest integration -v

      - name: Stack logs on failure
        if: failure()
        run: docker compose -p atlas-integration -f docker-compose.yml logs --no-color --tail 200
