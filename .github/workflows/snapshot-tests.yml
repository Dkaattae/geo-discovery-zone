name: Snapshot tests

# The snapshot lane: `question-bank/src/*.snapshot.ts` and
# `frontend/src/*.snapshot.ts`. Each file
# pins hashes and counts of the repo as it stood on an old commit, so any later
# change anywhere can turn them red. They are kept for reference and run here
# once a month, never on pull requests or pushes, and never in CI's test step
# (`bun test` only picks up `*.test.*`).
#
# To change how often this runs, edit the cron line below. To run it now, use
# "Run workflow" on the Actions tab.
on:
  schedule:
    # 06:17 UTC on the 1st of every month.
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  question-bank-snapshots:
    name: question-bank (snapshot lane)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: question-bank
    steps:
      - uses: actions/checkout@v5
        with:
          # Several snapshots read files at old commits with `git show`.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install
        run: bun install --frozen-lockfile

      # No network in tests, the same dead-proxy guard as CI's Test steps.
      - name: Snapshot tests
        timeout-minutes: 15
        run: |
          export HTTP_PROXY=http://127.0.0.1:1
          export HTTPS_PROXY=http://127.0.0.1:1
          export ALL_PROXY=http://127.0.0.1:1
          export http_proxy=http://127.0.0.1:1
          export https_proxy=http://127.0.0.1:1
          export all_proxy=http://127.0.0.1:1
          bun run test:snapshots

  frontend-snapshots:
    name: frontend (snapshot lane)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install
        run: bun install --frozen-lockfile

      # No network in tests, the same dead-proxy guard as CI's Test steps.
      - name: Snapshot tests
        timeout-minutes: 15
        run: |
          export HTTP_PROXY=http://127.0.0.1:1
          export HTTPS_PROXY=http://127.0.0.1:1
          export ALL_PROXY=http://127.0.0.1:1
          export http_proxy=http://127.0.0.1:1
          export https_proxy=http://127.0.0.1:1
          export all_proxy=http://127.0.0.1:1
          bun run test:snapshots
