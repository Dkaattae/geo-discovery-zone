name: CI

# Every pull request targeting the default branch, and every push to it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# One job per package. `question-bank` pins typescript@^7 and `frontend` pins
# ^5.8, with different tsconfig.json files, so `tsc` is never run over both at
# once. Separate jobs also mean a red package does not hide the other one.
jobs:
  frontend:
    name: frontend (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned rather than `latest`: a bun release should not be able to
          # turn this workflow red on a branch nobody touched.
          bun-version: 1.3.11

      # --frozen-lockfile installs exactly what bun.lock pins and fails instead
      # of resolving anything new, so the run cannot rewrite the lockfile.
      # frontend/bunfig.toml sets minimumReleaseAge = 86400, which means an
      # unpinned install can legitimately resolve differently in CI than it did
      # locally — a lockfile that drifts in CI is a supply-chain guard that has
      # stopped guarding.
      - name: Install
        id: install
        run: bun install --frozen-lockfile

      # Evidence in the run's own log that the install left bun.lock alone.
      - name: Lockfile unchanged
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git diff --exit-code -- bun.lock

      # The three checks below are independent: each runs whenever the install
      # succeeded, rather than only when the step before it passed, so one red
      # check does not hide the result of the others. This never turns a failing
      # check green — a failed step still fails the job and the run.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # `bun test` exits 1 when a package contains no test files at all, and
        # frontend/ has none until T-004 adds them. Skip only that exact case:
        # the moment any test file exists, bun's own exit code decides this
        # step. Deliberately not `continue-on-error` or `|| true`, either of
        # which would still be here when T-004 lands and would quietly ignore
        # real failures.
        run: |
          set -euo pipefail
          test_files=$(find . -regextype posix-extended \
            -type d \( -name node_modules -o -name dist -o -name .output -o -name .vinxi -o -name .git \) -prune -o \
            -type f -regex '.*[._](test|spec)\.(js|jsx|ts|tsx)$' -print -quit)
          if [ -z "$test_files" ]; then
            echo "No test files in frontend/ yet — skipping bun test (T-004 adds the first)."
            exit 0
          fi
          echo "Test files found (first match: $test_files) — running bun test."
          bun test

  question-bank:
    name: question-bank (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: question-bank
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install
        id: install
        run: bun install --frozen-lockfile

      - name: Lockfile unchanged
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git diff --exit-code -- bun.lock

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck

      # No lint step: question-bank has no eslint config and no eslint
      # dependency, and adding either is a dependency decision this task may not
      # make on its own. Its formatting is covered by nothing today; see the
      # brief's Handoff.
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun test
